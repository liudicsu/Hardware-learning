    <rect x="22" y="85" width="10" height="125" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
    <path d="M -48 140 C -46 122 -38 112 -28 112 C -12 112 -8 122 0 122 C 8 122 12 112 28 112 C 38 112 46 122 48 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
