    <rect x="-5" y="85" width="10" height="125" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
    <path d="M -32 140 L -30 128 C -26 126 -24 134 -20 126 L -16 134 L -12 120 L -8 130 L -4 114 L 0 128 L 4 118 L 8 132 L 12 121 C 16 127 18 134 22 126 C 26 130 29 135 32 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <path d="M -8 138 L -4 128 L 1 135 L 5 123" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#18181b">7 扰动焊点</text>
  </g>
</svg>
