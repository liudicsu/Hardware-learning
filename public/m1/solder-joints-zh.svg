  </g>

  <g transform="translate(770,0)">
    <rect x="-55" y="150" width="110" height="55" fill="#d4d4d8" stroke="#52525b" stroke-width="1.5"/>
    <rect x="-8" y="150" width="16" height="55" fill="#a1a1aa" stroke="#52525b" stroke-width="1"/>
    <rect x="-5" y="85" width="10" height="125" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
    <g transform="rotate(-14 -42 140)">
      <rect x="-42" y="140" width="84" height="8" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <path d="M -34 140 C -30 126 -14 119 -5 114 L -5 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
      <path d="M 5 140 L 5 114 C 14 119 30 126 34 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    </g>
    <text x="0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#18181b">6 焊盘翘起</text>
  </g>

  <g transform="translate(910,0)">
    <rect x="-55" y="150" width="110" height="55" fill="#d4d4d8" stroke="#52525b" stroke-width="1.5"/>
    <rect x="-8" y="150" width="16" height="55" fill="#a1a1aa" stroke="#52525b" stroke-width="1"/>
