    <path d="M 5 140 L 5 127 C 8 129 12 133 14 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#18181b">4 锡过少</text>
