<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 370" width="480" height="370" role="img" aria-labelledby="title desc">
  <title id="title">七种焊点的横截面</title>
  <desc id="desc">七个简化横截面：1 好，凹形焊脚；2 冷焊，颗粒状锡团；3 锡过多，凸起的锡球；4 锡过少，焊盘露出；5 桥连，一团锡连接两个焊盘和引脚；6 焊盘翘起，焊盘外缘脱离板面；7 扰动焊点，表面撕裂并有裂纹。未画出孔壁镀层和孔内焊料。</desc>
