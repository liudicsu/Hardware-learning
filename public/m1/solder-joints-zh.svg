<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title desc">
  <title id="title">七个焊点的横截面</title>
  <desc id="desc">七个横截面图：1 好，凹形圆角；2 冷焊，颗粒状不平整；3 锡过多，凸起的锡球；4 锡过少，焊盘露出；5 桥连，两个焊盘和引脚被一摊锡连在一起；6 焊盘翘起，焊盘从板上掀起；7 扰动焊点，表面撕裂并有裂纹。</desc>
  <rect width="980" height="300" fill="#ffffff"/>

  <g transform="translate(70,0)">
    <rect x="-55" y="150" width="110" height="55" fill="#d4d4d8" stroke="#52525b" stroke-width="1.5"/>
    <rect x="-8" y="150" width="16" height="55" fill="#a1a1aa" stroke="#52525b" stroke-width="1"/>
    <rect x="-42" y="140" width="84" height="8" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <rect x="-5" y="85" width="10" height="125" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
    <path d="M -34 140 C -18 139 -6 130 -5 108 L -5 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <path d="M 5 140 L 5 108 C 6 130 18 139 34 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#18181b">1 好</text>
  </g>

  <g transform="translate(210,0)">
    <rect x="-55" y="150" width="110" height="55" fill="#d4d4d8" stroke="#52525b" stroke-width="1.5"/>
    <rect x="-8" y="150" width="16" height="55" fill="#a1a1aa" stroke="#52525b" stroke-width="1"/>
    <rect x="-42" y="140" width="84" height="8" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <rect x="-5" y="85" width="10" height="125" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
    <path d="M -23 140 C -22 132 -18 134 -16 127 C -13 120 -9 126 -6 118 C -3 111 1 117 4 112 C 8 118 11 113 14 121 C 17 127 20 131 23 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="-11" cy="132" r="1.1" fill="#64748b"/>
    <circle cx="8" cy="134" r="1" fill="#64748b"/>
    <circle cx="-2" cy="126" r="0.9" fill="#64748b"/>
    <text x="0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#18181b">2 冷焊</text>
  </g>

  <g transform="translate(350,0)">
    <rect x="-55" y="150" width="110" height="55" fill="#d4d4d8" stroke="#52525b" stroke-width="1.5"/>
    <rect x="-8" y="150" width="16" height="55" fill="#a1a1aa" stroke="#52525b" stroke-width="1"/>
    <rect x="-42" y="140" width="84" height="8" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <rect x="-5" y="85" width="10" height="125" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
    <path d="M -40 140 C -44 112 -30 82 -16 80 C -8 79 8 79 16 80 C 30 82 44 112 40 140 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#18181b">3 锡过多</text>
  </g>

  <g transform="translate(490,0)">
