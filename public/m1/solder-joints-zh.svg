    <rect x="-8" y="150" width="16" height="55" fill="#a1a1aa" stroke="#52525b" stroke-width="1"/>
    <rect x="-42" y="140" width="84" height="8" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
